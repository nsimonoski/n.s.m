<div class="explorer-shell">
  <div class="main-area">
    <ide-activity-bar />
    <div class="panel-content" [style.width.px]="coreStore.width()">
      @switch (coreStore.activePanel()) {
        @case ('explorer') {
          <ide-file-explorer [fileToOpen]="fileToOpen()" />
        }
        @case ('git') {
          <ide-file-explorer-git />
        }
      }
      <div class="resize-handle" (mousedown)="onResizeStart($event)"></div>
    </div>
  </div>
  <ide-footer />
</div>

@if (showFilePicker()) {
  <ide-file-picker (fileSelected)="onFileSelected($event)" (closed)="onFilePickerClosed()" />
}
