<div class="explorer-shell">
  <div class="main-area">
    <ide-activity-bar />
    <div
      class="mobile-backdrop"
      [class.visible]="layoutStore.sidebarOpen()"
      (click)="layoutStore.closeSidebar()"
    ></div>
    <div
      class="panel-content"
      [class.mobile-open]="layoutStore.sidebarOpen()"
      [style.width.px]="layoutStore.width()"
    >
      <router-outlet />
      <div class="resize-handle" (mousedown)="onResizeStart($event)"></div>
    </div>
  </div>
  <ide-footer />
</div>

@if (showFileSearch()) {
  <ide-file-search (fileSelected)="onFileSelected($event)" (closed)="onFileSearchClosed()" />
}

<ui-snackbar />
<ide-voice-control />
