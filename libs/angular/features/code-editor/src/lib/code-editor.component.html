<div class="code-editor">
  @if (store.openFiles().length > 0) {
    <ide-tab-bar />
    @if (store.activeFile()?.mode === 'diff') {
      <ide-monaco-diff-editor />
    } @else {
      <ide-monaco-editor />
    }
  } @else {
    <div class="empty-state">
      <span class="empty-message">Open a file to start editing</span>
    </div>
  }
  @if (store.activeFile()?.isDirty) {
    <button class="save-fab" (click)="save()" aria-label="Save file">
      <svg viewBox="0 0 24 24">
        <path
          d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"
        />
      </svg>
    </button>
  }
</div>
