<div class="terminal-panel" [style.height.px]="layoutStore.terminalHeight()">
  <div class="terminal-resize-handle" (mousedown)="onResizeStart($event)"></div>
  <div class="terminal-tabs">
    @for (tab of store.tabs(); track tab.sessionId) {
      <button
        class="terminal-tab"
        [class.active]="tab.sessionId === store.activeSessionId()"
        (click)="onTabClick(tab.sessionId)"
      >
        {{ tab.name }}
        <button class="terminal-tab-close" (click)="onCloseTab($event, tab.sessionId)" title="Close">×</button>
      </button>
    }
    @if (store.tabs().length < 4) {
      <button class="terminal-tab-add" (click)="onAddTab()" title="New Terminal">+</button>
    }
  </div>
  <div #terminalHost class="terminal-host"></div>
</div>
