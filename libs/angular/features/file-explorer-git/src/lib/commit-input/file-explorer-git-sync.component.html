<div class="commit-input">
  <textarea
    class="message-input"
    placeholder="Message (Ctrl+Enter to commit)"
    [ngModel]="commitStore.commitMessage()"
    (ngModelChange)="commitStore.setCommitMessage($event)"
    (keydown)="onKeydown($event)"
    rows="1"
  ></textarea>
  @if (hasPendingSync()) {
    <button class="commit-button sync" (click)="onSync()">
      {{ syncLabel() }}
    </button>
  } @else {
    <button
      class="commit-button"
      [disabled]="!commitStore.commitMessage().trim() || !hasStagedFiles()"
      (click)="onCommit()"
    >
      Commit
    </button>
  }
</div>
