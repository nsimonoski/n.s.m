<div class="git-explorer">
  <ide-file-explorer-git-sync />

  @if (store.isLoading()) {
    <div class="loading">Loading...</div>
  }

  @if (stagedTree()) {
    <div class="section-header">{{ stagedTree()!.name }}</div>
    <ui-file-tree
      [rootDirectory]="stagedTree()!"
      [statusMap]="store.statusMap()"
      [nodeActions]="stagedNodeActions"
      [autoExpandAll]="true"
      (handleOpen)="onFileClick($event)"
      (handleNodeAction)="onNodeAction($event)"
    >
      <ng-template #contextMenu let-ctx let-close="close">
        <ui-context-menu
          [x]="ctx.x"
          [y]="ctx.y"
          [node]="ctx.node"
          [menuConfig]="getMenuItems(ctx.node)"
          (itemClicked)="onContextMenuAction($event); close()"
          (closed)="close()"
        />
      </ng-template>
    </ui-file-tree>
  }

  @if (changesTree()) {
    <div class="section-header">{{ changesTree()!.name }}</div>
    <ui-file-tree
      [rootDirectory]="changesTree()!"
      [statusMap]="store.statusMap()"
      [nodeActions]="changesNodeActions"
      [autoExpandAll]="true"
      (handleOpen)="onFileClick($event)"
      (handleNodeAction)="onNodeAction($event)"
    >
      <ng-template #contextMenu let-ctx let-close="close">
        <ui-context-menu
          [x]="ctx.x"
          [y]="ctx.y"
          [node]="ctx.node"
          [menuConfig]="getMenuItems(ctx.node)"
          (itemClicked)="onContextMenuAction($event); close()"
          (closed)="close()"
        />
      </ng-template>
    </ui-file-tree>
  }

  <ui-confirmation-dialog
    [isOpen]="discardDialogOpen()"
    title="Discard Changes"
    message="Are you sure you want to discard changes? This cannot be undone."
    (confirmed)="onDiscardConfirmed()"
    (cancelled)="closeDiscardDialog()"
  />
</div>
