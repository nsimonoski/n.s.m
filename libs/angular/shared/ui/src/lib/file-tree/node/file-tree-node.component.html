<div
  class="tree-node"
  [class.selected]="isSelected()"
  [class.grayed]="isGrayed()"
  (click)="onNodeClick()"
  (contextmenu)="onContextMenu($event)"
>
  @for (guide of indentGuides(); track $index) {
    <span class="indent-guide"></span>
  }

  @if (isDirectory()) {
    <span class="expand-icon">
      <i [class]="'codicon ' + expandIcon()"></i>
    </span>
  }

  @if (!isDirectory()) {
    <span class="expand-spacer"></span>
  }

  <span class="file-icon" [style.color]="fileIcon().color">
    <i [class]="'codicon ' + fileIcon().iconClass"></i>
  </span>

  <span class="name">{{ node().name }}</span>
</div>

@if (isDirectory() && isExpanded() && hasChildren()) {
  @for (child of children(); track child.path) {
    <app-file-tree-node
      [node]="child"
      [level]="level() + 1"
      (nodeClicked)="nodeClicked.emit($event)"
      (toggleExpand)="toggleExpand.emit($event)"
      (contextMenu)="contextMenu.emit($event)"
    />
  }
}
