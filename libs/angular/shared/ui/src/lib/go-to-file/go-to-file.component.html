<div class="backdrop" (click)="onBackdropClick()">
  <div class="go-to-file-panel" (click)="$event.stopPropagation()">
    <input
      #searchInput
      type="text"
      class="search-input"
      placeholder="Go to file..."
      [value]="query()"
      (input)="onQueryChange(searchInput.value)"
      (keydown)="onKeydown($event)"
      autocomplete="off"
      spellcheck="false"
    />

    @if (loading()) {
      <div class="status-message">Searching...</div>
    }

    @if (results().length > 0) {
      <ul class="results-list">
        @for (file of results(); track file.path; let i = $index) {
          <li
            class="result-item"
            [class.active]="i === activeIndex()"
            (click)="selectFile(file)"
            (mouseenter)="activeIndex.set(i)"
          >
            <span class="result-name">{{ file.name }}</span>
            <span class="result-path">{{ file.path }}</span>
          </li>
        }
      </ul>
    }

    @if (!loading() && query().length > 0 && results().length === 0) {
      <div class="status-message">No files found</div>
    }
  </div>
</div>
