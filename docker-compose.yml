services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - CORS_ORIGINS=https://kod3.dev
      - ANGULAR_IDE_URL=https://kod3.dev/angular
      - REACT_IDE_URL=https://kod3.dev/react
      - OAUTH_CALLBACK_URL=https://kod3.dev/api/auth/github/callback
      - WORKSPACE_BASE_DIR=/data/workspaces
      - WORKSPACE_HOST_PATH=/opt/kode/workspaces
      - DOCKER_HOST=tcp://docker-proxy:2375
      - WORKSPACE_NETWORK=workspace-net
    env_file:
      - .env.production
    tmpfs:
      - /tmp/private-workspaces:size=512M
    volumes:
      - /opt/kode/workspaces:/data/workspaces
    networks:
      - default
      - internal
    depends_on:
      - redis
      - docker-proxy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD}
    networks:
      - internal

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - EXEC=1
      - POST=1
      - PING=1
      - NETWORKS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  workspace:
    build:
      context: .
      dockerfile: docker/workspace/Dockerfile
    image: nsm-workspace:latest
    profiles:
      - build-only

networks:
  internal:
    internal: true
  workspace-net:
    driver: bridge
