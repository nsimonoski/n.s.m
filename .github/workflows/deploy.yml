name: Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npx nx affected -t lint --base=$NX_BASE --head=$NX_HEAD

      - name: Build Angular
        run: npx nx build angular-ide --configuration=production

      - name: Build React
        run: npx nx build react-ide

      - name: Build NestJS API
        run: npx nx build nestjs-api

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 204.168.150.34 >> ~/.ssh/known_hosts

      - name: Upload Angular
        run: rsync -avz --delete dist/apps/angular-ide/browser/ root@204.168.150.34:/var/www/kod3.dev/angular/

      - name: Upload React
        run: rsync -avz --delete apps/react-ide/dist/ root@204.168.150.34:/var/www/kod3.dev/react/

      - name: Upload API + Docker files
        run: |
          rsync -avz apps/nestjs-api/dist/main.js apps/nestjs-api/dist/package.json root@204.168.150.34:/opt/kode/
          rsync -avz Dockerfile docker-compose.yml root@204.168.150.34:/opt/kode/

      - name: Create .env.production on server
        run: |
          ssh root@204.168.150.34 "cat > /opt/kode/.env.production << 'EOF'
          OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET=${{ secrets.OAUTH_CLIENT_SECRET }}
          DEMO_REPO_URL=${{ secrets.DEMO_REPO_URL }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          SESSION_ENCRYPTION_KEY=${{ secrets.SESSION_ENCRYPTION_KEY }}
          EOF"

      - name: Restart API
        run: ssh root@204.168.150.34 "cd /opt/kode && docker compose up -d --build"
