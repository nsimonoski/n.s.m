<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kod3.dev (React)</title>
    <base href="/react/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.scss" />
  </head>
  <body>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('ide-theme'));
        if (t && t.theme) document.documentElement.setAttribute('data-theme', t.theme);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
